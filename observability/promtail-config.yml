# ─────────────────────────────────────────
# Poseidon - Promtail Configuration
# Ships Docker container logs into Loki
# ─────────────────────────────────────────

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ─────────────────────────────────────────
  # Docker container logs
  # Reads from /var/lib/docker/containers
  # and labels each stream by container name
  # ─────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - poseidon-engine
              - poseidon-dashboard
              - poseidon-postgres
              - poseidon-ollama

    relabel_configs:
      # Use container name as the log stream label
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"

      # Add the Docker image as a label
      - source_labels: [__meta_docker_container_image]
        target_label: image

      # Add compose service name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

    # Parse JSON logs from the Rust engine
    pipeline_stages:
      - json:
          expressions:
            level:       level
            message:     msg
            campaign_id: campaign_id
            target_email: target_email
            event:       event

      - labels:
          level:
          campaign_id:

      - output:
          source: message
