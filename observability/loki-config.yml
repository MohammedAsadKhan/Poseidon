# ─────────────────────────────────────────
# Poseidon - Loki Configuration
# Log aggregation for all campaign events
# Retention: 30 days
# ─────────────────────────────────────────

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# ─────────────────────────────────────────
# Common storage path
# All Loki data lives in the named volume
# mounted in docker-compose
# ─────────────────────────────────────────
common:
  instance_addr: 127.0.0.1
  path_prefix:   /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ─────────────────────────────────────────
# Query range settings
# Controls how Loki handles log queries
# ─────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled:  true
        max_size_mb: 100

# ─────────────────────────────────────────
# Schema config
# Defines how logs are stored and indexed
# ─────────────────────────────────────────
schema_config:
  configs:
    - from:        2024-01-01
      store:       tsdb
      object_store: filesystem
      schema:      v13
      index:
        prefix: index_
        period: 24h

# ─────────────────────────────────────────
# Ruler - alerting rules (optional)
# Uncomment and configure if you want
# Loki to fire alerts on log patterns
# ─────────────────────────────────────────
ruler:
  alertmanager_url: http://localhost:9093

# ─────────────────────────────────────────
# Limits - retention and ingestion
# ─────────────────────────────────────────
limits_config:
  # Keep logs for 30 days
  retention_period: 720h

  # Ingestion rate limits - generous for a
  # single-org security awareness platform
  ingestion_rate_mb:        16
  ingestion_burst_size_mb:  32
  max_streams_per_user:     10000
  max_line_size:            256kb

  # Allow queries across 30 days of data
  max_query_lookback: 720h
  max_query_length:   720h

  # Split large queries into 1 hour chunks
  # for better performance
  split_queries_by_interval: 1h

# ─────────────────────────────────────────
# Compactor - handles retention cleanup
# Runs daily to remove logs older than
# the retention period
# ─────────────────────────────────────────
compactor:
  working_directory:       /loki/compactor
  compaction_interval:     10m
  retention_enabled:       true
  retention_delete_delay:  2h
  retention_delete_worker_count: 150
  delete_request_store:    filesystem

# ─────────────────────────────────────────
# Analytics - disable phone-home telemetry
# ─────────────────────────────────────────
analytics:
  reporting_enabled: false
