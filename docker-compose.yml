services:

  # ─────────────────────────────────────────
  # Rust core engine - campaign management + REST API
  # ─────────────────────────────────────────
  engine:
    build: ./engine
    container_name: poseidon-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8080}:8080"       # REST API
      - "${METRICS_PORT:-9090}:9090"      # Prometheus metrics
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - TRACKER_BASE_URL=${TRACKER_BASE_URL}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - MOCK_AI=${MOCK_AI:-false}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - engine_data:/app/data
    depends_on:
      - postgres
      - ollama
    networks:
      - poseidon-net

  # ─────────────────────────────────────────
  # React dashboard
  # ─────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: poseidon-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${ENGINE_PORT:-8080}
    depends_on:
      - engine
    networks:
      - poseidon-net

  # ─────────────────────────────────────────
  # PostgreSQL - campaign and target data
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: poseidon-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-poseidon}
      - POSTGRES_USER=${POSTGRES_USER:-poseidon}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - poseidon-net

  # ─────────────────────────────────────────
  # Ollama - local LLM for AI email generation
  # GPU accelerated on desktop, CPU fallback on laptop
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama
    container_name: poseidon-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - poseidon-net

  # ─────────────────────────────────────────
  # Prometheus - scrapes engine metrics
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: poseidon-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - poseidon-net

  # ─────────────────────────────────────────
  # Loki - log aggregation
  # ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: poseidon-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - poseidon-net

  # ─────────────────────────────────────────
  # Grafana - dashboards
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: poseidon-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - poseidon-net

# ─────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────
volumes:
  engine_data:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  ollama_data:

# ─────────────────────────────────────────
# Internal network
# ─────────────────────────────────────────
networks:
  poseidon-net:
    driver: bridge
