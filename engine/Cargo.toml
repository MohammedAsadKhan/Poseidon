[package]
name = "poseidon-engine"
version = "0.1.0"
edition = "2021"
authors = ["Mohammed Asad Khan"]
description = "Poseidon phishing simulation engine - campaign management, email delivery, and tracking"

[[bin]]
name = "poseidon"
path = "src/main.rs"

[dependencies]

# ─────────────────────────────────────────
# Web framework + async runtime
# ─────────────────────────────────────────
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# ─────────────────────────────────────────
# Database
# ─────────────────────────────────────────
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }

# ─────────────────────────────────────────
# Email delivery
# ─────────────────────────────────────────
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }

# ─────────────────────────────────────────
# Serialization
# ─────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─────────────────────────────────────────
# Unique IDs + timestamps
# ─────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ─────────────────────────────────────────
# Prometheus metrics
# ─────────────────────────────────────────
prometheus = { version = "0.13", features = ["process"] }

# ─────────────────────────────────────────
# Logging
# ─────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ─────────────────────────────────────────
# Configuration + environment
# ─────────────────────────────────────────
dotenvy = "0.15"
config = "0.14"

# ─────────────────────────────────────────
# Error handling
# ─────────────────────────────────────────
anyhow = "1"
thiserror = "1"

# ─────────────────────────────────────────
# Hashing (tracking token generation)
# ─────────────────────────────────────────
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
axum-test = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
